services:
  postgres-testing:
    image: postgres:17.11-alpine3.23
    container_name: gudang-integration-test-postgres
    env_file:
      - .env.pgsql.testing
    ports:
      - 127.0.0.1:55432:5432
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
